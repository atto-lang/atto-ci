# Injected into a parentless snapshot commit pushed to a PRIVATE atto-ci mirror repo.
# The source repo's own workflows are parked under atto-ci/orig-workflows; only this file runs.
# Linux always runs; macOS runs only when the snapshot contains atto-ci/mac (batch merge runs).
# Java on macOS is split into 4 test-class shards (mac runners are much slower); other kinds use shard 0.
name: atto-ci
on:
  push:
    branches: ['ci/**']
permissions:
  contents: read
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, shard: 0 }
          - { os: macos-15, shard: 0 }
          - { os: macos-15, shard: 1 }
          - { os: macos-15, shard: 2 }
          - { os: macos-15, shard: 3 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Platform gate
        id: gate
        shell: bash
        run: |
          run=true; shards=1
          if [ "${{ matrix.os }}" = macos-15 ]; then
            [ -f atto-ci/mac ] || run=false
            if [ -f atto-ci/kind-java ]; then shards=4; elif [ "${{ matrix.shard }}" != 0 ]; then run=false; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"; echo "shards=$shards" >> "$GITHUB_OUTPUT"
      - name: Toolchains (java)
        if: steps.gate.outputs.run == 'true' && hashFiles('atto-ci/kind-java') != ''
        uses: actions/setup-java@v4
        with:
          distribution: graalvm
          java-version: '25'
          cache: maven
      - name: Toolchains (net)
        if: steps.gate.outputs.run == 'true' && hashFiles('atto-ci/kind-net') != ''
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: '24'
      - name: Toolchains (llvm, linux)
        if: steps.gate.outputs.run == 'true' && hashFiles('atto-ci/kind-llvm') != '' && runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-19 llvm-19-dev lld-19 libclang-rt-19-dev >/dev/null
      - name: Toolchains (llvm, macos)
        if: steps.gate.outputs.run == 'true' && hashFiles('atto-ci/kind-llvm') != '' && runner.os == 'macOS'
        run: brew install -q llvm@19
      - name: Run suites
        if: steps.gate.outputs.run == 'true'
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ steps.gate.outputs.shards }}
        run: bash atto-ci/run.sh
      - name: Upload result
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: atto-ci-result-${{ runner.os == 'macOS' && format('mac-{0}', matrix.shard) || 'linux' }}
          path: atto-ci-out/
          retention-days: 3
